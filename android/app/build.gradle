plugins {
    id "com.android.application"
}

// Same SDL3 release as the upstream recompiler, and a separate checkout
// so the unmodified PC build does not share Android build dependencies.
def sdlDir = file("../third_party/SDL")
tasks.register("fetchSDL") {
    onlyIf { !new File(sdlDir, "CMakeLists.txt").exists() }
    doLast {
        exec {
            commandLine "git", "clone", "--depth", "1", "--branch", "release-3.4.16",
                        "https://github.com/libsdl-org/SDL.git", sdlDir.absolutePath
        }
    }
}
preBuild.dependsOn "fetchSDL"

android {
    namespace "org.shaolinmobiu"
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.shaolinmobiu"
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName (project.findProperty("shaolinNativeGame") == "true" ?
            "0.2.0-xbox-gameboot" : "0.1.0-launcher-preview")
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                // Private local Android build: compile/link the user's own
                // translated Xbox code inside libmain.so only when explicitly
                // requested. CI/default APK stays launcher-only.
                arguments "-DSHAOLIN_ENABLE_GUEST_OBJECTS=" +
                    ((project.findProperty("shaolinNativeGame") == "true" ||
                      project.findProperty("shaolinGuestObjects") == "true") ? "ON" : "OFF"),
                    "-DSHAOLIN_EMBED_NATIVE_GUEST=" +
                    (project.findProperty("shaolinNativeGame") == "true" ? "ON" : "OFF"),
                    "-DSHAOLIN_BUILD_REVISION=" + (project.findProperty("shaolinRevision") ?: "unknown")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(sdlDir, "android-project/app/src/main/java")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // XZ for Java: decode PC-compatible Krypt .tar.xz packages inside app sandbox.
    implementation "org.tukaani:xz:1.12"
}
