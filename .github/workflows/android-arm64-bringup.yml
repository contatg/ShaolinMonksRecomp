name: Android ARM64 Vulkan bringup
on:
  workflow_dispatch:
  push:
    branches: [android-arm64-bringup]
    paths:
      - 'android/**'
      - '.github/workflows/android-arm64-bringup.yml'
permissions:
  contents: read
jobs:
  android-vulkan-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android tools
        run: sdkmanager --install "platforms;android-34" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Build Android Vulkan test APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Shaolin-Mobiu-Vulkan-Test-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
