name: Android ARM64 Vulkan bringup
on:
  workflow_dispatch:
  push:
    branches: [android-arm64-bringup]
    paths:
      - 'android/**'
      - '.github/workflows/android-arm64-bringup.yml'
permissions:
  contents: read
jobs:
  android-vulkan-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android tools using the runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under ${ANDROID_HOME}/cmdline-tools"
            find "${ANDROID_HOME}" -maxdepth 3 -type d | head -70
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Fetch SDL3 before Gradle configuration
        shell: bash
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git android/third_party/SDL
          test -f android/third_party/SDL/CMakeLists.txt
      - name: Build Android Vulkan test APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Shaolin-Mobiu-Vulkan-Test-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
